<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ember Grove · Valley presets</title>
<style>
  body { margin: 24px auto; max-width: 1280px; padding: 0 12px; background: #191b20; color: #e3ded3; font: 16px system-ui; }
  h1 { font-size: 1.45rem; }
  img { display: block; width: 100%; height: auto; background: #111; }
  select { font: inherit; padding: .4em; }
  a { color: #e5bd96; }
</style>
<h1>Ember Grove</h1>
<img id="preset" src="presets/0.png" alt="Procedurally rendered sunrise valley" width="1280" height="720">
<p><label>Camera position <select>
  <option value="0">Start</option>
  <option value="124">Middle</option>
  <option value="247">End</option>
</select></label></p>
<p><a href="renderer.html">Open live GPU renderer</a> · <a href="Valley.glsl" download>Download GLSL</a></p>
<script>
  const camera = document.querySelector('select');
  function showPreset() {
    document.getElementById('preset').src = 'presets/' + camera.value + '.png';
  }
  camera.addEventListener('change', showPreset);
  window.addEventListener('pageshow', showPreset);
</script>
</html>
